    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .content {
            background-color: #fff;
            display: flex;
            position: relative;
            width: 100%;
            overflow-x: hidden;
        }
        .block {
        display: flex;
        flex: 0 1 100%;
        width: 100%;
        margin: 2rem 0;
        margin-top: 4rem;
        flex-wrap: wrap;
        justify-content: space-between;
        padding: 0 2rem;
        position: relative;
       }
       .block ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        width: 100%;
        margin: 0;
        padding: 0;
        list-style: none;
       }
       .block ul img {
        max-width: 80%;
        max-height: 80%;
        height: auto;
        }
        .block li {
        flex: 0 1 calc(25% - 2rem);
        padding: 1rem;
        width: auto;
        height: 30rem;
        position: relative;
        display: block;
        transition: all 0.5s ease;
        margin: 1rem;
       }
       .block li:hover{
        scale: 150%;
       }
       .block li img{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
       }
       .block li video{
        max-width: 80%;
        max-height: 80%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
       }
       @media(min-width: 1201px) {
           /* 新增悬停效果样式 */
           .block li::before {
               content: "";
               position: absolute;
               top: 0;
               left: 0;
               width: 100%;
               height: 100%;
               background-color: rgba(0, 0, 0, 0.7);
               opacity: 0;
               transition: opacity 0.5s ease;
               z-index: 2; /* 确保色块在图片上方 */
           }
           
           .block li::after {
               content: "description";
               position: absolute;
               top: 50%;
               left: 50%;
               transform: translate(-50%, -50%);
               color: #fff;
               opacity: 0;
               transition: opacity 0.5s ease;
               pointer-events: none;
               z-index: 3; /* 确保文字在色块上方 */
           }
           
           .block li:hover::before,
           .block li:hover::after {
               opacity: 1;
           }
       }
       @media(max-width: 1200px){
           .block li {
               flex: 0 1 calc(50% - 2rem);
           }
       }
    </style>
